<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OilPress CRM</title>
    <link rel="icon" href="/static/images/подсолнечное.jpg" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('oilpress-theme');
          if (t !== 'dark' && t !== 'light') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
    <script type="module" crossorigin src="/static/index.js?v={{ asset_version }}"></script>
    <link rel="stylesheet" crossorigin href="/static/index.css?v={{ asset_version }}" />
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
